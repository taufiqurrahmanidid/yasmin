version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0-alpine
    container_name: yasmin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-yasmin_rs}
      MYSQL_USER: ${DB_USER:-yasmin_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-yasmin_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yasmin-net

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yasmin-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-mysql://yasmin_user:yasmin_pass@mysql:3306/yasmin_rs}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
      SIMRS_BASE_URL: ${SIMRS_BASE_URL:-http://localhost:8088/api}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - yasmin-net
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yasmin-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - yasmin-net
    restart: unless-stopped

  # Nginx Reverse Proxy (Production-like)
  nginx:
    image: nginx:alpine
    container_name: yasmin-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - yasmin-net
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  yasmin-net:
    driver: bridge
