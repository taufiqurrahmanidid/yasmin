name: Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Audit backend dependencies
        run: npm audit --prefix backend --audit-level=moderate || true
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=moderate || true

  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for secrets
        run: |
          FOUND=$(grep -r "PASSWORD\|SECRET\|API_KEY\|TOKEN" \
            --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=dist \
            backend frontend | \
            grep -v "process.env" | \
            grep -v ".env.example" | \
            grep -v "^[^:]*:[^/]*//" | \
            grep -v "const.*=.*process\.env" | \
            wc -l)
          if [ "$FOUND" -gt 0 ]; then
            echo "❌ Possible hardcoded secrets found!"
            grep -r "PASSWORD\|SECRET\|API_KEY\|TOKEN" \
              --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" \
              --exclude-dir=node_modules --exclude-dir=dist \
              backend frontend | \
              grep -v "process.env" | grep -v ".env.example"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
