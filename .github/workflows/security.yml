name: Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Audit backend dependencies
        run: npm audit --prefix backend --audit-level=moderate || true
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=moderate || true

  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for hardcoded secrets
        run: |
          # Look for actual hardcoded values: password='...', api_key="...", etc
          # Ignore: process.env references, comments, .env.example files
          FOUND=$(grep -rn "password\s*=\s*['\"].*['\"]" \
            --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=dist \
            backend frontend | \
            grep -v "process\.env\|\.env\.example" | wc -l)
          if [ "$FOUND" -gt 0 ]; then
            echo "❌ Hardcoded password found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
